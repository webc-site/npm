[package]
name = "cersei_rs"
version = "0.1.1"
edition = "2024"
license = "MulanPSL-2.0"
repository = "https://github.com/webc-site/npm.git"
homepage = "https://github.com/webc-site/npm/tree/main/cersei_rs"
description = "cersei_rs"
keywords = []
categories = []
readme = "README.md"

[features]
default = []

[lib]
crate-type = ["cdylib"]


[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
anyhow = "1.0.104"
cersei = "0.2.6"
futures = "0.3.34"
napi = { version = "3.16.1", features = ["async", "tokio_rt"] }
napi-derive = "3.7.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt", "sync"] }

[dev-dependencies]
aok = "0.1.18"
log = "0.4.35"
log_init = "0.1.39"
static_init = "1.0.4"
