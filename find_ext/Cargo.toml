[package]
name = "find_ext"
version = "0.2.1"
edition = "2024"
license = "MulanPSL-2.0"
repository = "https://github.com/webc-site/npm.git"
homepage = "https://github.com/webc-site/npm/tree/main/find_ext"
description = "Find files by extension while walking a directory, streaming paths through a bounded channel / 遍历目录按后缀查找文件，通过有界队列流式返回"
keywords = ["find", "extension", "walk", "directory", "stream"]
categories = ["filesystem", "development-tools"]
readme = "README.md"

[features]
default = []

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
crossfire = "3.1.22"
ignore_dir = { version = "0.1.3", path = "../ignore_dir" }
log = "0.4.34"
thiserror = "2.0.20"
walkdir = "2.5.0"

[dev-dependencies]
aok = "0.1.18"
ctor = "1.0.13"
log_init = "0.1.39"
tempfile = "3.27.0"

