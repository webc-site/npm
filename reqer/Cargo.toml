[package]
name = "reqer"
version = "0.1.2"
edition = "2024"
license = "MulanPSL-2.0"
repository = "https://github.com/webc-site/npm.git"
homepage = "https://github.com/webc-site/npm/tree/main/reqer"
description = "Unified HTTP client for Native and WebAssembly / 跨平台原生与 WebAssembly 统一 HTTP 客户端"
keywords = ["http", "client", "wasm", "reqwest", "fetch"]
categories = [
  "web-programming",
  "network-programming",
  "asynchronous",
  "wasm",
  "api-bindings"
]
readme = "README.md"

[features]
default = []

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
bytes = "1.12.1"
thiserror = "2.0.20"

[dev-dependencies]
aok = "0.1.18"
log = "0.4.34"
log_init = "0.1.39"
static_init = "1.0.4"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { version = "0.13.4", default-features = false, features = ["rustls"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }
gloo-net = { version = "0.7.0", default-features = false, features = ["http"] }
js-sys = "0.3.104"